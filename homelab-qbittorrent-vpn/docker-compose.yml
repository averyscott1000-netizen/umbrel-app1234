version: "3.7"

services:
  app_proxy:
    environment:
      # qBittorrent runs inside Gluetun's network, so its web UI is reached
      # through the gluetun container. Umbrel login stays required.
      APP_HOST: homelab-qbittorrent-vpn_gluetun_1
      APP_PORT: 8080

  gluetun:
    image: qmcgaw/gluetun:v3
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Your VPN provider, keys and passwords are NOT set here. Set them in
    # umbrelOS: right-click the app > Settings > Environment variables.
    # Never put real keys or passwords in this file - the repo is public.
    environment:
      VPN_TYPE: "wireguard"
      TZ: "America/New_York"
    volumes:
      - ${APP_DATA_DIR}/data/gluetun:/gluetun

  # Runs once before qBittorrent starts and applies the settings qBittorrent
  # needs to work behind Umbrel's app proxy (same idea as the official app):
  # - turns off Host header validation (otherwise the web UI says "Unauthorized")
  # - trusts Umbrel's proxy and lets Gluetun (localhost) update the port
  # - sets the default login admin / adminadmin if no password was set yet
  # - sets the download folder to /downloads if none was set yet
  config:
    image: debian:bookworm-slim
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        CONF=/config/config/qBittorrent.conf
        mkdir -p /config/config
        touch "$$CONF"
        grep -q '^\[WebUI\]' "$$CONF" || printf '\n[WebUI]\n' >> "$$CONF"
        grep -q '^\[BitTorrent\]' "$$CONF" || printf '\n[BitTorrent]\n' >> "$$CONF"
        setkey() {
          if grep -q "^$$1=" "$$CONF"; then
            sed -i "s|^$$1=.*|$$1=$$2|" "$$CONF"
          else
            sed -i "/^\[WebUI\]/a $$1=$$2" "$$CONF"
          fi
        }
        setkey HostHeaderValidation false
        setkey LocalHostAuth false
        setkey ReverseProxySupportEnabled true
        setkey TrustedReverseProxiesList 10.21.0.0/16
        grep -q '^Password_PBKDF2=' "$$CONF" || sed -i '/^\[WebUI\]/a Password_PBKDF2="@ByteArray(gTzqQHUv3A1X43tLaAhaJQ==:ZBCIBA4honNZ7H66xdEoHpqBC/Vvwj17ZCjQKARSK78ScJWDMdWSfxezHG536UekAL/zpRn571MXCfhtdqiArA==)"' "$$CONF"
        grep -q '^Session\\DefaultSavePath=' "$$CONF" || sed -i '/^\[BitTorrent\]/a Session\\DefaultSavePath=/downloads' "$$CONF"
        chown -R 1000:1000 /config
        echo "qBittorrent settings are ready"

  server:
    image: ghcr.io/hotio/qbittorrent:release-5.3.0
    restart: on-failure
    # All qBittorrent traffic goes through Gluetun. If the VPN is down,
    # qBittorrent has no internet at all (built-in kill switch).
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started
      config:
        condition: service_completed_successfully
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: "America/New_York"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Same shared Downloads folder the official media apps use (/downloads)
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
